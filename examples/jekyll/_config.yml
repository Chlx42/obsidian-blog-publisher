title: My Jekyll Blog
email: your-email@example.com
description: >-
  A blog powered by Jekyll
baseurl: ""
url: "https://example.com"
twitter_username: jekyllrb
github_username:  jekyll

# Build settings
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Exclude from processing
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - scripts/
  - package.json
  - .blog-config.json
  - .blog-manifest.json
